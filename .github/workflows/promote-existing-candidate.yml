name: promote-existing-candidate

on:
  workflow_dispatch:
    inputs:
      candidate_version: { required: true, type: string }
      source_run_id: { required: true, type: string }
      source_artifact_id: { required: true, type: string }
      expected_outer_artifact_digest: { required: true, type: string }
      expected_product_sha256: { required: true, type: string }
      source_commit: { required: true, type: string }
      tested_merge_commit: { required: true, type: string }
      release_tag: { required: true, type: string }
      acknowledge_promotion:
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  validate-dispatch-ref:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require default-branch dispatch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Existing-candidate promotion must be dispatched from refs/heads/main; got ${GITHUB_REF}." >&2
            exit 1
          fi

  promote:
    needs: validate-dispatch-ref
    if: ${{ inputs.acknowledge_promotion && github.ref == 'refs/heads/main' }}
    concurrency:
      group: monitor-release-tag-${{ inputs.release_tag }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ inputs.candidate_version }}
      RUN_ID: ${{ inputs.source_run_id }}
      ARTIFACT_ID: ${{ inputs.source_artifact_id }}
      OUTER_DIGEST: ${{ inputs.expected_outer_artifact_digest }}
      PRODUCT_SHA: ${{ inputs.expected_product_sha256 }}
      SOURCE_SHA: ${{ inputs.source_commit }}
      TESTED_SHA: ${{ inputs.tested_merge_commit }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      REPOSITORY_ID: ${{ github.repository_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate source run and artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          [[ "${RELEASE_TAG}" == "v${VERSION}" ]]
          [[ "${RUN_ID}" =~ ^[1-9][0-9]*$ && "${ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${REPOSITORY_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${OUTER_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "${PRODUCT_SHA}" =~ ^[a-f0-9]{64}$ ]]
          [[ "${SOURCE_SHA}" =~ ^[a-f0-9]{40}$ && "${TESTED_SHA}" =~ ^[a-f0-9]{40}$ ]]

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          [[ "$(jq -r '.status' <<<"${run_json}")" == completed ]]
          [[ "$(jq -r '.conclusion' <<<"${run_json}")" == success ]]
          [[ "$(jq -r '.path' <<<"${run_json}")" == '.github/workflows/production-candidate.yml' ]]
          [[ "$(jq -r '.head_sha' <<<"${run_json}")" == "${SOURCE_SHA}" ]]
          [[ "$(jq -r '.repository.id' <<<"${run_json}")" == "${REPOSITORY_ID}" ]]
          [[ "$(jq -r '.head_repository.id' <<<"${run_json}")" == "${REPOSITORY_ID}" ]]

          name="Monitor-${VERSION}-win-x64"
          item="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          [[ "$(jq -r '.id' <<<"${item}")" == "${ARTIFACT_ID}" ]]
          [[ "$(jq -r '.workflow_run.id' <<<"${item}")" == "${RUN_ID}" ]]
          [[ "$(jq -r '.workflow_run.head_sha' <<<"${item}")" == "${SOURCE_SHA}" ]]
          [[ "$(jq -r '.workflow_run.repository_id' <<<"${item}")" == "${REPOSITORY_ID}" ]]
          [[ "$(jq -r '.workflow_run.head_repository_id' <<<"${item}")" == "${REPOSITORY_ID}" ]]
          [[ "$(jq -r '.name' <<<"${item}")" == "${name}" ]]
          [[ "$(jq -r '.digest' <<<"${item}")" == "${OUTER_DIGEST}" ]]
          [[ "$(jq -r '.expired' <<<"${item}")" == false ]]
          size_in_bytes="$(jq -r '.size_in_bytes' <<<"${item}")"
          [[ "${size_in_bytes}" =~ ^[1-9][0-9]*$ ]]

      - name: Download exact artifact from selected run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.source_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          path: artifacts

      - name: Validate exact selected candidate bytes
        shell: pwsh
        run: |
          ./scripts/Test-ExistingCandidatePromotion.ps1 `
            -ArtifactPath "artifacts/Monitor-${env:VERSION}-win-x64.zip" `
            -ChecksumPath "artifacts/Monitor-${env:VERSION}-win-x64.zip.sha256" `
            -CandidateVersion $env:VERSION `
            -ExpectedProductSha256 $env:PRODUCT_SHA `
            -SourceCommit $env:SOURCE_SHA `
            -TestedMergeCommit $env:TESTED_SHA | Out-Null

      - name: Publish or verify immutable durable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip="Monitor-${VERSION}-win-x64.zip"
          sum="${zip}.sha256"
          release_flags=(--latest=false)
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_flags+=(--prerelease)
          fi

          bash -n ./scripts/Verify-DurableRelease.sh

          verify_release() {
            local dir="$1"
            bash ./scripts/Verify-DurableRelease.sh \
              --repository "${GITHUB_REPOSITORY}" \
              --tag "${RELEASE_TAG}" \
              --version "${VERSION}" \
              --product-sha256 "${PRODUCT_SHA}" \
              --trusted-root "${RUNNER_TEMP}" \
              --destination "${dir}"
          }

          if tag_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha' 2>/dev/null)"; then
            [[ "${tag_commit}" == "${TESTED_SHA}" ]]
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              verify_release "${RUNNER_TEMP}/existing-release"
              echo 'Exact durable release already exists; no mutation performed.'
              exit 0
            fi
            gh release create "${RELEASE_TAG}" "artifacts/${zip}" "artifacts/${sum}" --verify-tag "${release_flags[@]}" --title "Monitor ${VERSION}" --notes "Promoted from existing verified candidate run ${RUN_ID}; no rebuild or repackaging. External IIS acceptance remains governed by #116."
          else
            gh release create "${RELEASE_TAG}" "artifacts/${zip}" "artifacts/${sum}" --target "${TESTED_SHA}" "${release_flags[@]}" --title "Monitor ${VERSION}" --notes "Promoted from existing verified candidate run ${RUN_ID}; no rebuild or repackaging. External IIS acceptance remains governed by #116."
          fi

          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')" == "${TESTED_SHA}" ]]
          verify_release "${RUNNER_TEMP}/verified-release"
