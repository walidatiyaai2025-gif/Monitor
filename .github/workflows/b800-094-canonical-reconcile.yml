name: b800-094-canonical-reconcile

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/b800-094-canonical-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/b800-094-advanced-evidence-accessibility
          fetch-depth: 0
      - name: Reconcile B800-094 canonical documentation with guarded replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one guarded match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          batch = "docs/BATCH_800.md"
          replace_once(
              batch,
              "- [x] B800-093 harden no-fake-data deployment behavior: keep the explicit Development demo estate, but fail startup whenever `DemoData:Enabled=true` outside Development; default deployed configuration remains false, disabled demo returns empty/null, and the guard adds no SQL/query/collector/refresh dependency (`docs/work/B800-093.md`, PR #328).\n- [ ] B800-094..100 continue responsive/accessibility, canonical exact-head and final closeout acceptance without adding unsupported production behavior.",
              "- [x] B800-093 harden no-fake-data deployment behavior: keep the explicit Development demo estate, but fail startup whenever `DemoData:Enabled=true` outside Development; default deployed configuration remains false, disabled demo returns empty/null, and the guard adds no SQL/query/collector/refresh dependency (`docs/work/B800-093.md`, PR #328 merged as `a476795e5c7c2343e12a42fdae57ce906d20c469`).\n- [x] B800-094 harden the newer TempDB/transaction-log/HA advanced-evidence tables for assistive technology: preserve responsive horizontal scrolling while adding complete ARIA table/row/header/cell semantics and explicit keyboard focus visibility, without changing evidence values or collection paths (`docs/work/B800-094.md`, PR #329).\n- [ ] B800-095..100 continue final canonical exact-head and closeout acceptance without adding unsupported production behavior.")
          replace_once(
              batch,
              "\n\n## Task program",
              "\n\nB800-094 closes a B800-specific accessibility gap without repeating the generic BATCH-700 UI foundation. TempDB, transaction-log and HA advanced-evidence scroll surfaces now expose `role=table` with seven `columnheader` cells and explicit row `cell` semantics while retaining their accessible names, `tabindex=0`, `.responsive-table` horizontal overflow and 680px minimum row width. `.responsive-table:focus-visible` joins the existing portal focus-outline group. Evidence values, truncation bounds, `Unavailable`/`NotEvaluated` truth and all projection/collector/query paths remain unchanged. Clean implementation head `14f8a782de548fbab6db455acc1999f1b05dbaa0` passed CI #2874 / `32086587126` and Windows production-candidate #539 / `32086587091`; Real SQL was not selected because no monitored-SQL query/collector/permission path changed.\n\n## Task program")
          replace_once(
              batch,
              "- B800-093 first clean head `c890d4b0b89f10dee8afd92f855d475780ef4c73` compiled production but CI #2854 exposed a test-only non-constant `InlineData` argument; corrected implementation head `57a7f159b5a03279c9581c77ca969ab03ac8d49e` passed CI #2856 / `32085709937` and Windows production-candidate #532 / `32085709940` end-to-end. Real SQL was not selected because no monitored-SQL query, collector or permission path changed. Exact final post-canonical-reconciliation validation remains required.",
              "- B800-093 first clean head `c890d4b0b89f10dee8afd92f855d475780ef4c73` compiled production but CI #2854 exposed a test-only non-constant `InlineData` argument; corrected implementation head `57a7f159b5a03279c9581c77ca969ab03ac8d49e` passed CI #2856 / `32085709937` and Windows production-candidate #532 / `32085709940`. Exact final reconciled head `3c0955a9f3c83ef47ddf35489a41b2e3d968aa0b` passed CI #2863 / `32085994720`, Real SQL #373 / `32085994707`, and Windows production-candidate #536 / `32085994704`; PR #328 squash-merged as `a476795e5c7c2343e12a42fdae57ce906d20c469`.\n- B800-094 clean implementation head `14f8a782de548fbab6db455acc1999f1b05dbaa0` passed CI #2874 / `32086587126` and Windows production-candidate #539 / `32086587091` end-to-end. Real SQL was not selected because no monitored-SQL query, collector or permission path changed. Exact final post-canonical-reconciliation validation remains required.")
          replace_once(
              batch,
              "## Current B800-093 merge gate\n\nPR #328 is the current focused B800 slice and closes B800-093 only. B800-092 / PR #327 is merged; B800-093 adds one startup configuration guard plus no-fake-data acceptance tests/documentation. Before PR #328 is marked Ready or merged, every repository-selected required workflow must be Green on the same exact final reconciled head, the branch must remain current with `main`, review threads must remain resolved, and the effective diff must stay bounded to B800-093 implementation/tests/work-note plus canonical reconciliation. Real SQL is required only if repository path policy selects it. Issue #287 remains OPEN for B800-094..100 final acceptance/closeout work.",
              "## Current B800-094 merge gate\n\nPR #329 is the current focused B800 slice and closes B800-094 only. B800-093 / PR #328 is merged; B800-094 changes advanced-evidence accessibility semantics/CSS plus acceptance tests/documentation only. Before PR #329 is marked Ready or merged, every repository-selected required workflow must be Green on the same exact final reconciled head, the branch must remain current with `main`, review threads must remain resolved, and the effective diff must stay bounded to B800-094 implementation/tests/work-note plus canonical reconciliation. Real SQL is required only if repository path policy selects it. Issue #287 remains OPEN for B800-095..100 final acceptance/closeout work.")

          catalog = "docs/FEATURE_CATALOG.md"
          replace_once(
              catalog,
              "| Functional operator screen wiring | BATCH-800 | In progress / PR #328 | Issue #287 remains OPEN. Evidence-backed production/report slices are merged through B800-090; B800-091 report acceptance and B800-092 write-surface security acceptance are merged. PR #328 carries B800-093 no-fake-data deployment hardening. B800-094..100 final acceptance/closeout remains pending; unsupported dimensions remain explicit and there is no RC.61/#116/#111 implication |",
              "| Functional operator screen wiring | BATCH-800 | In progress / PR #329 | Issue #287 remains OPEN. Evidence-backed production/report slices are merged through B800-090; B800-091 report acceptance, B800-092 write-surface security acceptance and B800-093 no-fake-data hardening are merged. PR #329 carries B800-094 advanced-evidence responsive/accessibility hardening. B800-095..100 final acceptance/closeout remains pending; unsupported dimensions remain explicit and there is no RC.61/#116/#111 implication |")
          replace_once(
              catalog,
              "| No-fake-data environment hardening | BATCH-800 / B800-093 | In validation / PR #328 | `DemoDataEnvironmentGuard` allows enabled synthetic demo estate data only in Development and fails startup for enabled demo data in Production, Staging or any other non-Development environment. Default deployed config stays false; Development explicitly opts in; disabled demo returns empty/null. Startup guard has no monitored-SQL/query/collector/refresh/registration dependency. Corrected implementation head `57a7f159b5a03279c9581c77ca969ab03ac8d49e` passed CI #2856 / `32085709937` and Windows production-candidate #532 / `32085709940`; Real SQL was not selected because no monitored-SQL path changed |",
              "| No-fake-data environment hardening | BATCH-800 / B800-093 | Complete / merged | `DemoDataEnvironmentGuard` allows enabled synthetic demo estate data only in Development and fails startup for enabled demo data in Production, Staging or any other non-Development environment. Default deployed config stays false; Development explicitly opts in; disabled demo returns empty/null. Exact final reconciled head `3c0955a9f3c83ef47ddf35489a41b2e3d968aa0b` passed CI #2863 / `32085994720`, Real SQL #373 / `32085994707`, and Windows production-candidate #536 / `32085994704`; PR #328 squash-merged as `a476795e5c7c2343e12a42fdae57ce906d20c469`. Startup guard has no monitored-SQL/query/collector/refresh/registration dependency |")
          replace_once(
              catalog,
              "\n\n## BATCH-200 Enterprise Operations Expansion",
              "\n| Advanced evidence responsive/accessibility hardening | BATCH-800 / B800-094 | In validation / PR #329 | TempDB, transaction-log and HA B800 evidence tables retain responsive horizontal scrolling and labelled keyboard reachability while adding complete ARIA `table` / `row` / `columnheader` / `cell` semantics plus explicit `.responsive-table:focus-visible`. Evidence values, row bounds, truncation and `Unavailable`/`NotEvaluated` truth are unchanged. Clean implementation head `14f8a782de548fbab6db455acc1999f1b05dbaa0` passed CI #2874 / `32086587126` and Windows production-candidate #539 / `32086587091`; Real SQL was not selected because no monitored-SQL path changed |\n\n## BATCH-200 Enterprise Operations Expansion")

          status = "docs/STATUS.md"
          replace_once(
              status,
              "PR #328 carries B800-093. `DemoDataEnvironmentGuard` now fails startup whenever `DemoData:Enabled=true` outside Development, while preserving the intentional Development-only demo estate. Default deployed config remains false; disabled `DemoMonitorService` returns empty/null rather than synthetic estate data; the startup hook runs before demo registration and adds no SQL/query/collector/refresh dependency. Corrected implementation head `57a7f159b5a03279c9581c77ca969ab03ac8d49e` passed CI #2856 / `32085709937` and Windows production-candidate #532 / `32085709940`; Real SQL was not selected because no monitored-SQL query, collector or permission path changed.\n\n**Ready/merge for B800-093 requires all four canonical files reconciled and every repository-selected required workflow Green on the same exact final post-reconciliation head**, no unresolved review threads, branch current with `main`, and a diff bounded to B800-093 implementation/tests/work-note/canonical reconciliation. #287 remains OPEN for B800-094..100 final acceptance/closeout work.",
              "B800-093 is complete and merged through PR #328 as `a476795e5c7c2343e12a42fdae57ce906d20c469`. `DemoDataEnvironmentGuard` fails startup whenever `DemoData:Enabled=true` outside Development while preserving the intentional Development-only demo estate. Exact final reconciled head `3c0955a9f3c83ef47ddf35489a41b2e3d968aa0b` passed CI #2863 / `32085994720`, Real SQL #373 / `32085994707`, and Windows production-candidate #536 / `32085994704`.\n\nPR #329 carries B800-094. TempDB, transaction-log and HA B800 advanced-evidence tables now expose complete ARIA table/row/header/cell semantics while retaining labelled `tabindex=0` horizontal scrolling, the 680px minimum row-width contract and the existing evidence values/bounds/truth. `.responsive-table:focus-visible` joins the shared portal focus outline. Clean implementation head `14f8a782de548fbab6db455acc1999f1b05dbaa0` passed CI #2874 / `32086587126` and Windows production-candidate #539 / `32086587091`; Real SQL was not selected because no monitored-SQL query, collector or permission path changed.\n\n**Ready/merge for B800-094 requires all four canonical files reconciled and every repository-selected required workflow Green on the same exact final post-reconciliation head**, no unresolved review threads, branch current with `main`, and a diff bounded to B800-094 implementation/tests/work-note/canonical reconciliation. #287 remains OPEN for B800-095..100 final acceptance/closeout work.")

          plan = "docs/IMPLEMENTATION_PLAN.md"
          replace_once(
              plan,
              "- B800-093 adds one startup hardening guard: enabled synthetic demo data is Development-only; any non-Development `DemoData:Enabled=true` fails startup, while disabled demo remains empty/null and Development demo behavior remains intentionally available;\n- B800-093 corrected implementation head `57a7f159b5a03279c9581c77ca969ab03ac8d49e` passed CI #2856 / `32085709937` and Windows production-candidate #532 / `32085709940`; Real SQL was not selected because no monitored-SQL query, collector or permission path changed. Exact final post-canonical-reconciliation validation remains required.",
              "- B800-093 is complete and merged through PR #328 as `a476795e5c7c2343e12a42fdae57ce906d20c469`; exact final reconciled head `3c0955a9f3c83ef47ddf35489a41b2e3d968aa0b` passed CI #2863 / `32085994720`, Real SQL #373 / `32085994707`, and Windows production-candidate #536 / `32085994704`;\n- B800-093 hardens deployed no-fake-data behavior: enabled synthetic demo data is Development-only, while disabled demo remains empty/null and Development demo remains intentionally available;\n- B800-094 changes UI semantics only: TempDB/transaction-log/HA advanced evidence keeps responsive horizontal scrolling but gains complete ARIA table/header/cell structure and explicit focus-visible styling for the focusable responsive table;\n- B800-094 clean implementation head `14f8a782de548fbab6db455acc1999f1b05dbaa0` passed CI #2874 / `32086587126` and Windows production-candidate #539 / `32086587091`; Real SQL was not selected because no monitored-SQL query, collector or permission path changed. Exact final post-canonical-reconciliation validation remains required.")
          replace_once(
              plan,
              "Least privilege remains read-only: SQL Server 2022+ uses `VIEW SERVER PERFORMANCE STATE` (older supported versions `VIEW SERVER STATE`) plus `VIEW ANY DEFINITION` and existing narrow metadata grants; Agent history/activity adds only read-only `SELECT` on `msdb.dbo.sysjobhistory` and `msdb.dbo.sysjobactivity`, with no SQLAgent execution/operator role. B800-071/072/073/074/075/076/077/078/079/080/081/082/083/084/085/086/087/088/089/090/091/092/093 add no monitored-SQL permission or query path.\n\nPR #328 becomes eligible for Ready/merge only after `BATCH_800`, `FEATURE_CATALOG`, `STATUS` and this plan are reconciled on one exact head, every repository-selected required workflow is Green on that same head, review threads are resolved, the branch is current with `main`, and the effective diff remains bounded to B800-093 plus canonical reconciliation. Real SQL is required only if repository path policy selects it. Merging #328 closes B800-093 only; #287 remains OPEN for B800-094..100 final acceptance/closeout.",
              "Least privilege remains read-only: SQL Server 2022+ uses `VIEW SERVER PERFORMANCE STATE` (older supported versions `VIEW SERVER STATE`) plus `VIEW ANY DEFINITION` and existing narrow metadata grants; Agent history/activity adds only read-only `SELECT` on `msdb.dbo.sysjobhistory` and `msdb.dbo.sysjobactivity`, with no SQLAgent execution/operator role. B800-071/072/073/074/075/076/077/078/079/080/081/082/083/084/085/086/087/088/089/090/091/092/093/094 add no monitored-SQL permission or query path.\n\nPR #329 becomes eligible for Ready/merge only after `BATCH_800`, `FEATURE_CATALOG`, `STATUS` and this plan are reconciled on one exact head, every repository-selected required workflow is Green on that same head, review threads are resolved, the branch is current with `main`, and the effective diff remains bounded to B800-094 plus canonical reconciliation. Real SQL is required only if repository path policy selects it. Merging #329 closes B800-094 only; #287 remains OPEN for B800-095..100 final acceptance/closeout.")

          print("B800-094 canonical reconciliation completed with guarded one-match replacements.")
          PY

          git diff --check
          git diff -- docs/BATCH_800.md docs/FEATURE_CATALOG.md docs/STATUS.md docs/IMPLEMENTATION_PLAN.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BATCH_800.md docs/FEATURE_CATALOG.md docs/STATUS.md docs/IMPLEMENTATION_PLAN.md
          git commit -m "B800-094: reconcile canonical tracking"
          git push origin HEAD:agent/b800-094-advanced-evidence-accessibility
