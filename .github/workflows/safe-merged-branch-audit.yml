name: Safe merged branch audit

on:
  pull_request:
    branches: [ main ]
    paths:
      - .github/workflows/safe-merged-branch-cleanup.yml
      - .github/workflows/safe-merged-branch-audit.yml
      - scripts/cleanup_merged_branches.py

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile cleanup script
        run: python3 -m py_compile scripts/cleanup_merged_branches.py
      - name: Audit candidates without modifying branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cleanup_merged_branches.py
