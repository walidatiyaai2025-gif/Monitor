name: batch100-merge-if-verified

on:
  push:
    branches:
      - agent/b100-10
    paths:
      - '.github/workflows/batch100-merge-if-verified.yml'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b100-10
          fetch-depth: 0

      - name: Require verified completion marker
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'B100-001..100 CI VERIFIED' docs/STATUS.md
          grep -q 'BATCH-100 COMPLETE' docs/STATUS.md

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Monitor.sln

      - name: Release build
        run: dotnet build Monitor.sln --configuration Release --no-restore --warnaserror

      - name: Full tests
        run: dotnet test Monitor.sln --configuration Release --no-build

      - name: Remove one-shot merge gate
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/batch100-merge-if-verified.yml
          git config user.name 'Monitor Release Gate'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'ci: remove one-shot BATCH-100 merge gate'
          git push origin HEAD:agent/b100-10

      - name: Merge verified PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge 75 --repo "$GITHUB_REPOSITORY" --squash --delete-branch --subject 'BATCH-100/10: complete enterprise operator features and RC acceptance (#75)' --body "Complete B100-091..100 and the 100-task BATCH-100 program. Verified completion marker was present, Release build passed with --warnaserror, and the full test suite passed in workflow $GITHUB_RUN_ID."
          gh issue close 74 --repo "$GITHUB_REPOSITORY" --reason completed || true
          gh issue close 55 --repo "$GITHUB_REPOSITORY" --reason completed || true
