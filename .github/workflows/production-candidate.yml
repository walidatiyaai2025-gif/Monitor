name: production-candidate

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/production-candidate.yml'
      - '.github/workflows/release.yml'
      - 'deploy/**'
      - 'docs/DEPLOY_IIS.md'
      - 'docs/UPGRADE_CHECKLIST.md'
      - 'docs/ROLLBACK_RUNBOOK.md'
      - 'docs/PRODUCTION_SINGLENODE_ACCEPTANCE.md'
      - 'docs/PRODUCTION_MVP.md'
      - 'docs/IMPLEMENTATION_PLAN.md'
      - 'docs/STATUS.md'
      - 'docs/FEATURE_CATALOG.md'
      - 'scripts/Smoke-Monitor.ps1'
      - 'scripts/Smoke-MonitorAuthentication.ps1'
      - 'scripts/Test-ProductionCandidate.ps1'
      - 'scripts/Accept-ProductionSingleNode.ps1'
      - 'scripts/Test-IisProductionPrerequisites.ps1'
      - 'scripts/Deploy-ProductionSingleNode.ps1'
      - 'scripts/New-ProductionAcceptanceEvidencePack.ps1'
      - 'scripts/Test-ProductionAcceptanceEvidence.ps1'
      - 'src/Monitor.Web/**'
      - 'tests/Monitor.Web.Tests/ProductionAdminCredentialGuardTests.cs'
      - 'tests/Monitor.Web.Tests/P05ProductionCandidateTests.cs'
      - 'tests/Monitor.Web.Tests/P05IisDeploymentAutomationTests.cs'
      - 'tests/Monitor.Web.Tests/P05ProductionAcceptanceEvidencePackTests.cs'

permissions:
  contents: read

jobs:
  windows-singlenode-candidate:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CANDIDATE_VERSION: 0.1.0-rc.${{ github.run_number }}
      CANDIDATE_PORT: '5089'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Monitor.sln

      - name: Release build
        run: dotnet build Monitor.sln --configuration Release --no-restore --warnaserror

      - name: Full test suite
        run: dotnet test Monitor.sln --configuration Release --no-build

      - name: Parse production PowerShell tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'scripts/Smoke-Monitor.ps1',
            'scripts/Smoke-MonitorAuthentication.ps1',
            'scripts/Test-ProductionCandidate.ps1',
            'scripts/Accept-ProductionSingleNode.ps1',
            'scripts/Test-IisProductionPrerequisites.ps1',
            'scripts/Deploy-ProductionSingleNode.ps1',
            'scripts/New-ProductionAcceptanceEvidencePack.ps1',
            'scripts/Test-ProductionAcceptanceEvidence.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path,
              [ref]$tokens,
              [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $messages = $errors | ForEach-Object { "${path}:$($_.Extent.StartLineNumber): $($_.Message)" }
              throw ($messages -join [Environment]::NewLine)
            }
          }

      - name: Exercise acceptance evidence closure validator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'monitor-p0-5-evidence-contract'
          Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $root, (Join-Path $root 'evidence') | Out-Null

          $source = ('a' * 40) -join ''
          $merge = ('b' * 40) -join ''
          $artifactHash = ('c' * 64) -join ''
          $thumbprint = ('d' * 40) -join ''
          $packPath = Join-Path $root 'p0-5-evidence-pack.json'
          $summaryPath = Join-Path $root 'p0-5-closure-summary.json'

          ./scripts/New-ProductionAcceptanceEvidencePack.ps1 `
            -CandidateVersion '0.0.0-ci' `
            -ArtifactFileName 'Monitor-0.0.0-ci-win-x64.zip' `
            -ArtifactSha256 $artifactHash `
            -SourceCommit $source `
            -TestedMergeCommit $merge `
            -HostName 'monitor.example.internal' `
            -SiteName 'Monitor' `
            -AppPoolName 'Monitor' `
            -AppPoolIdentity 'IIS AppPool\Monitor' `
            -CertificateThumbprint $thumbprint `
            -OperationalBackupId 'ci-backup-001' `
            -PreviousPhysicalPath 'C:\Program Files\Monitor\releases\previous' `
            -StateRoot 'C:\ProgramData\Monitor\App_Data' `
            -OutputPath $packPath

          $pack = Get-Content -LiteralPath $packPath -Raw | ConvertFrom-Json -Depth 20
          $gateIndex = 0
          foreach ($property in $pack.gates.PSObject.Properties) {
            $gateIndex++
            $relative = "evidence/$($property.Name).txt"
            $target = Join-Path $root $relative
            "gate=$($property.Name);result=PASS;source=windows-ci" | Set-Content -LiteralPath $target -Encoding utf8NoBOM
            $property.Value.passed = $true
            $property.Value.verifiedAtUtc = [DateTimeOffset]::UtcNow.AddSeconds(-30 + $gateIndex).ToString('O')
            $property.Value.evidenceRef = $relative
            $property.Value.evidenceSha256 = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $pack.acceptedBy = 'ci-operator'
          $pack.acceptedAtUtc = [DateTimeOffset]::UtcNow.ToString('O')
          $pack | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $packPath -Encoding utf8NoBOM

          ./scripts/Test-ProductionAcceptanceEvidence.ps1 -EvidencePath $packPath -ClosureSummaryPath $summaryPath | Out-Null
          if (-not (Test-Path -LiteralPath $summaryPath -PathType Leaf)) { throw 'Positive closure validator did not create a summary.' }

          function Assert-Rejected {
            param([string]$Path, [string]$FailureMessage)
            $rejected = $false
            try {
              ./scripts/Test-ProductionAcceptanceEvidence.ps1 -EvidencePath $Path | Out-Null
            }
            catch {
              $rejected = $true
            }
            if (-not $rejected) { throw $FailureMessage }
          }

          $negativeGatePath = Join-Path $root 'negative-gate.json'
          $negativeGate = Get-Content -LiteralPath $packPath -Raw | ConvertFrom-Json -Depth 20
          $negativeGate.gates.artifactChecksumVerified.passed = $false
          $negativeGate | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $negativeGatePath -Encoding utf8NoBOM
          Assert-Rejected -Path $negativeGatePath -FailureMessage 'Negative gate unexpectedly passed.'

          $tamperedHashPath = Join-Path $root 'tampered-hash.json'
          $tamperedHash = Get-Content -LiteralPath $packPath -Raw | ConvertFrom-Json -Depth 20
          $tamperedHash.gates.iisPreflightPassed.evidenceSha256 = ('0' * 64) -join ''
          $tamperedHash | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $tamperedHashPath -Encoding utf8NoBOM
          Assert-Rejected -Path $tamperedHashPath -FailureMessage 'Tampered evidence hash unexpectedly passed.'

          $secretPath = Join-Path $root 'secret-bearing.json'
          $secretPack = Get-Content -LiteralPath $packPath -Raw | ConvertFrom-Json -Depth 20
          $secretPack | Add-Member -NotePropertyName 'password' -NotePropertyValue 'must-never-be-retained'
          $secretPack | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $secretPath -Encoding utf8NoBOM
          Assert-Rejected -Path $secretPath -FailureMessage 'Secret-bearing evidence unexpectedly passed.'

      - name: Restore Windows x64 runtime graph
        run: dotnet restore src/Monitor.Web/Monitor.Web.csproj --runtime win-x64

      - name: Publish Windows x64 candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          dotnet publish src/Monitor.Web/Monitor.Web.csproj `
            --configuration Release `
            --no-restore `
            --runtime win-x64 `
            --self-contained false `
            /p:TreatWarningsAsErrors=true `
            /p:Version="$env:CANDIDATE_VERSION" `
            --output artifacts/publish

      - name: Validate secret-free SingleNode publish baseline
        shell: pwsh
        run: ./scripts/Test-ProductionCandidate.ps1 -PublishPath ./artifacts/publish

      - name: Prepare ephemeral Production runtime configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item deploy/appsettings.Production.example.json artifacts/publish/appsettings.Production.json -Force

          $salt = New-Object byte[] 16
          $passwordBytes = New-Object byte[] 24
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($salt)
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($passwordBytes)
          $adminPassword = 'Pc!' + [Convert]::ToHexString($passwordBytes)
          $iterations = 150000
          $kdf = [System.Security.Cryptography.Rfc2898DeriveBytes]::new(
            $adminPassword,
            $salt,
            $iterations,
            [System.Security.Cryptography.HashAlgorithmName]::SHA256)
          try {
            $hash = $kdf.GetBytes(32)
          }
          finally {
            $kdf.Dispose()
          }

          $certificatePasswordBytes = New-Object byte[] 24
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($certificatePasswordBytes)
          $certificatePassword = [Convert]::ToHexString($certificatePasswordBytes)
          $secureCertificatePassword = ConvertTo-SecureString $certificatePassword -AsPlainText -Force
          $certificate = New-SelfSignedCertificate `
            -DnsName 'localhost' `
            -Subject 'CN=localhost' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -NotAfter (Get-Date).AddDays(1) `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -KeyExportPolicy Exportable
          $pfxPath = Join-Path $env:RUNNER_TEMP 'monitor-candidate-https.pfx'
          Export-PfxCertificate -Cert $certificate -FilePath $pfxPath -Password $secureCertificatePassword | Out-Null

          $saltBase64 = [Convert]::ToBase64String($salt)
          $hashBase64 = [Convert]::ToBase64String($hash)
          Write-Output "::add-mask::$adminPassword"
          Write-Output "::add-mask::$saltBase64"
          Write-Output "::add-mask::$hashBase64"
          Write-Output "::add-mask::$certificatePassword"

          "ASPNETCORE_ENVIRONMENT=Production" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ASPNETCORE_URLS=https://localhost:$env:CANDIDATE_PORT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AllowedHosts=localhost" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Kestrel__Certificates__Default__Path=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Kestrel__Certificates__Default__Password=$certificatePassword" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DevelopmentAdmin__Username=ProductionCandidateAdmin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DevelopmentAdmin__Iterations=$iterations" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DevelopmentAdmin__SaltBase64=$saltBase64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DevelopmentAdmin__HashBase64=$hashBase64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MONITOR_CANDIDATE_ADMIN_PASSWORD=$adminPassword" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MONITOR_CANDIDATE_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Start candidate and run first production smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publish = (Resolve-Path artifacts/publish).Path
          $stdout = Join-Path $env:RUNNER_TEMP 'monitor-candidate-first.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'monitor-candidate-first.stderr.log'
          $process = Start-Process dotnet -ArgumentList 'Monitor.Web.dll' -WorkingDirectory $publish -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $process.Id | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'monitor-candidate.pid') -Encoding ascii

          try {
            $baseUri = "https://localhost:$env:CANDIDATE_PORT"
            $live = "$baseUri/health/live"
            $ready = $false
            for ($attempt = 1; $attempt -le 60; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri $live -UseBasicParsing -TimeoutSec 2 -SkipCertificateCheck
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Published Production candidate did not reach HTTPS /health/live.' }
            ./scripts/Smoke-Monitor.ps1 -BaseUri $baseUri -AllowUntrustedLoopbackCertificate
            ./scripts/Smoke-MonitorAuthentication.ps1 `
              -BaseUri $baseUri `
              -Username 'ProductionCandidateAdmin' `
              -Password $env:MONITOR_CANDIDATE_ADMIN_PASSWORD `
              -AllowUntrustedLoopbackCertificate
          } catch {
            Write-Host '--- candidate stdout ---'
            if (Test-Path $stdout) { Get-Content $stdout -Tail 200 }
            Write-Host '--- candidate stderr ---'
            if (Test-Path $stderr) { Get-Content $stderr -Tail 200 }
            throw
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            $process.WaitForExit()
          }

      - name: Restart same published candidate and repeat smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publish = (Resolve-Path artifacts/publish).Path
          $stdout = Join-Path $env:RUNNER_TEMP 'monitor-candidate-restart.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'monitor-candidate-restart.stderr.log'
          $process = Start-Process dotnet -ArgumentList 'Monitor.Web.dll' -WorkingDirectory $publish -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $baseUri = "https://localhost:$env:CANDIDATE_PORT"
            $live = "$baseUri/health/live"
            $ready = $false
            for ($attempt = 1; $attempt -le 60; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri $live -UseBasicParsing -TimeoutSec 2 -SkipCertificateCheck
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Restarted Production candidate did not reach HTTPS /health/live.' }
            ./scripts/Smoke-Monitor.ps1 -BaseUri $baseUri -AllowUntrustedLoopbackCertificate
            ./scripts/Smoke-MonitorAuthentication.ps1 `
              -BaseUri $baseUri `
              -Username 'ProductionCandidateAdmin' `
              -Password $env:MONITOR_CANDIDATE_ADMIN_PASSWORD `
              -AllowUntrustedLoopbackCertificate
            if (-not (Test-Path artifacts/publish/App_Data/keyring -PathType Container)) {
              throw 'Persistent local Data Protection key ring was not created in the candidate state directory.'
            }
          } catch {
            Write-Host '--- restarted candidate stdout ---'
            if (Test-Path $stdout) { Get-Content $stdout -Tail 200 }
            Write-Host '--- restarted candidate stderr ---'
            if (Test-Path $stderr) { Get-Content $stderr -Tail 200 }
            throw
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            $process.WaitForExit()
          }

      - name: Stage operations bundle and remove runtime state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item artifacts/publish/appsettings.Production.json -Force
          Remove-Item artifacts/publish/App_Data -Recurse -Force -ErrorAction SilentlyContinue

          $ops = 'artifacts/publish/_operations'
          New-Item -ItemType Directory -Force -Path "$ops/deploy", "$ops/scripts", "$ops/docs" | Out-Null
          Copy-Item deploy/appsettings.Production.example.json "$ops/deploy/" -Force
          Copy-Item deploy/production-acceptance-evidence.example.json "$ops/deploy/" -Force
          Copy-Item scripts/Smoke-Monitor.ps1 "$ops/scripts/" -Force
          Copy-Item scripts/Smoke-MonitorAuthentication.ps1 "$ops/scripts/" -Force
          Copy-Item scripts/Test-ProductionCandidate.ps1 "$ops/scripts/" -Force
          Copy-Item scripts/Accept-ProductionSingleNode.ps1 "$ops/scripts/" -Force
          Copy-Item scripts/Test-IisProductionPrerequisites.ps1 "$ops/scripts/" -Force
          Copy-Item scripts/Deploy-ProductionSingleNode.ps1 "$ops/scripts/" -Force
          Copy-Item scripts/New-ProductionAcceptanceEvidencePack.ps1 "$ops/scripts/" -Force
          Copy-Item scripts/Test-ProductionAcceptanceEvidence.ps1 "$ops/scripts/" -Force
          Copy-Item docs/DEPLOY_IIS.md "$ops/docs/" -Force
          Copy-Item docs/UPGRADE_CHECKLIST.md "$ops/docs/" -Force
          Copy-Item docs/ROLLBACK_RUNBOOK.md "$ops/docs/" -Force
          Copy-Item docs/REAL_SQL_ACCEPTANCE.md "$ops/docs/" -Force
          Copy-Item docs/PRODUCTION_SINGLENODE_ACCEPTANCE.md "$ops/docs/" -Force

          $manifest = [ordered]@{
            schemaVersion = 1
            product = 'Monitor'
            version = $env:CANDIDATE_VERSION
            testedMergeSha = '${{ github.sha }}'
            sourceHeadSha = '${{ github.event.pull_request.head.sha || github.sha }}'
            runtime = 'win-x64'
            framework = 'net8.0'
            deploymentMode = 'SingleNode'
            configuration = 'Release'
            builtAtUtc = [DateTimeOffset]::UtcNow.ToString('O')
            realSqlAcceptance = @{
              normalCi = '31481874425'
              realSql = '31481874501'
              realSqlCases = 8
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "$ops/release-manifest.json" -Encoding utf8

      - name: Revalidate clean package input
        shell: pwsh
        run: ./scripts/Test-ProductionCandidate.ps1 -PublishPath ./artifacts/publish

      - name: Create ZIP and SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "artifacts/Monitor-$env:CANDIDATE_VERSION-win-x64.zip"
          $checksum = "$zip.sha256"
          Compress-Archive -Path 'artifacts/publish/*' -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content -LiteralPath $checksum -Encoding ascii
          ./scripts/Test-ProductionCandidate.ps1 -PublishPath ./artifacts/publish -PackagePath $zip -ChecksumPath $checksum
          Write-Host "Candidate: $zip"
          Write-Host "SHA-256: $hash"

      - name: Upload production candidate
        uses: actions/upload-artifact@v4
        with:
          name: Monitor-${{ env.CANDIDATE_VERSION }}-win-x64
          path: |
            artifacts/Monitor-${{ env.CANDIDATE_VERSION }}-win-x64.zip
            artifacts/Monitor-${{ env.CANDIDATE_VERSION }}-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove ephemeral HTTPS certificate
        if: always()
        shell: pwsh
        run: |
          $thumbprint = $env:MONITOR_CANDIDATE_CERT_THUMBPRINT
          if ([string]::IsNullOrWhiteSpace($thumbprint)) { exit 0 }
          Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -Force -ErrorAction SilentlyContinue
