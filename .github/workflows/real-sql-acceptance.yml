name: real-sql-acceptance

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/real-sql-acceptance.yml'
      - 'global.json'
      - 'scripts/sql/monitored_sql_least_privilege.sql'
      - 'src/Monitor.Web/Program.cs'
      - 'src/Monitor.Web/Models/**'
      - 'src/Monitor.Web/Controllers/ConnectionLabController.cs'
      - 'src/Monitor.Web/Controllers/OperationsController.cs'
      - 'src/Monitor.Web/Controllers/ServerConnectionsController.cs'
      - 'src/Monitor.Web/Services/ConnectionSecretStore.cs'
      - 'src/Monitor.Web/Services/CredentialHaServices.cs'
      - 'src/Monitor.Web/Services/DurableServerRegistrationRepository.cs'
      - 'src/Monitor.Web/Services/EnterpriseOperatorServices.cs'
      - 'src/Monitor.Web/Services/GovernedSqlSnapshotQuery.cs'
      - 'src/Monitor.Web/Services/HaSnapshotQuery.cs'
      - 'src/Monitor.Web/Services/MonitorReadService.cs'
      - 'src/Monitor.Web/Services/ProtectedFileConnectionSecretStore.cs'
      - 'src/Monitor.Web/Services/ServerHealthSnapshotCache.cs'
      - 'src/Monitor.Web/Services/SnapshotRefreshService.cs'
      - 'src/Monitor.Web/Services/TempDbSnapshotQuery.cs'
      - 'src/Monitor.Web/Services/TransactionLogSnapshotQuery.cs'
      - 'src/Monitor.Web/Services/SqlConnectionStringFactory.cs'
      - 'src/Monitor.Web/Services/SqlConnectionTester.cs'
      - 'src/Monitor.Web/Services/SqlServerSnapshotCollector.cs'
      - 'tests/Monitor.Web.Tests/B800HaRealSqlTests.cs'
      - 'tests/Monitor.Web.Tests/B800TempDbRealSqlTests.cs'
      - 'tests/Monitor.Web.Tests/B800TransactionLogRealSqlTests.cs'
      - 'tests/Monitor.Web.Tests/EnterpriseScaleTests.cs'
      - 'tests/Monitor.Web.Tests/RealSqlAcceptanceTests.cs'
      - 'tests/Monitor.Web.Tests/SqlConnectionTesterTests.cs'
      - 'tests/Monitor.Web.Tests/P05WorkflowSupplyChainTests.cs'
      - 'docs/REAL_SQL_ACCEPTANCE.md'
      - 'docs/PRODUCTION_MVP.md'
      - 'docs/IMPLEMENTATION_PLAN.md'
      - 'docs/STATUS.md'
      - 'docs/FEATURE_CATALOG.md'

permissions:
  contents: read

jobs:
  real-sql-2022:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SQL_CONTAINER: monitor-p0-sql2022
      SQL_HOST_PORT: '14333'
      MONITOR_LOGIN: monitor_acceptance
      LIMITED_LOGIN: monitor_limited
      NO_MSDB_LOGIN: monitor_no_msdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
          global-json-file: global.json

      - name: Generate ephemeral SQL credentials
        shell: bash
        run: |
          set -euo pipefail
          SQL_SA_PASSWORD="Aa1!$(openssl rand -hex 18)"
          MONITOR_SQL_PASSWORD="Bb2!$(openssl rand -hex 18)"
          LIMITED_SQL_PASSWORD="Cc3!$(openssl rand -hex 18)"
          NO_MSDB_SQL_PASSWORD="Dd4!$(openssl rand -hex 18)"
          for secret in "$SQL_SA_PASSWORD" "$MONITOR_SQL_PASSWORD" "$LIMITED_SQL_PASSWORD" "$NO_MSDB_SQL_PASSWORD"; do
            echo "::add-mask::$secret"
          done
          {
            echo "SQL_SA_PASSWORD=$SQL_SA_PASSWORD"
            echo "MONITOR_SQL_PASSWORD=$MONITOR_SQL_PASSWORD"
            echo "LIMITED_SQL_PASSWORD=$LIMITED_SQL_PASSWORD"
            echo "NO_MSDB_SQL_PASSWORD=$NO_MSDB_SQL_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Start real SQL Server 2022 target
        shell: bash
        run: |
          set -euo pipefail
          docker run -d \
            --name "$SQL_CONTAINER" \
            --hostname monitor-p0-sql2022 \
            -e ACCEPT_EULA=Y \
            -e MSSQL_PID=Developer \
            -e MSSQL_AGENT_ENABLED=true \
            -e MSSQL_SA_PASSWORD="$SQL_SA_PASSWORD" \
            -p "$SQL_HOST_PORT:1433" \
            mcr.microsoft.com/mssql/server@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89 # 2022-latest verified 2026-08-15

      - name: Wait for SQL Server readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if docker exec "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$SQL_SA_PASSWORD" -C -b -Q "SET NOCOUNT ON; SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server is ready after $attempt attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server did not become ready." >&2
          docker logs "$SQL_CONTAINER" 2>&1 | tail -n 200 >&2
          exit 1

      - name: Wait for SQL Server Agent service
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            STATUS=$(docker exec "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$SQL_SA_PASSWORD" -C -b -h -1 -W \
              -Q "SET NOCOUNT ON; SELECT CASE WHEN EXISTS (SELECT 1 FROM sys.dm_server_services WHERE servicename LIKE 'SQL Server Agent%' AND status_desc = 'Running') THEN 1 ELSE 0 END;" \
              2>/dev/null | tr -d '[:space:]' || true)
            if [ "$STATUS" = "1" ]; then
              echo "SQL Server Agent service is running after $attempt attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server Agent service did not become ready." >&2
          docker logs "$SQL_CONTAINER" 2>&1 | tail -n 200 >&2
          exit 1

      - name: Seed real acceptance estate
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$SQL_SA_PASSWORD" -C -b <<SQL
          CREATE LOGIN [$MONITOR_LOGIN]
            WITH PASSWORD = N'$MONITOR_SQL_PASSWORD', CHECK_POLICY = ON;
          CREATE LOGIN [$LIMITED_LOGIN]
            WITH PASSWORD = N'$LIMITED_SQL_PASSWORD', CHECK_POLICY = ON;
          CREATE LOGIN [$NO_MSDB_LOGIN]
            WITH PASSWORD = N'$NO_MSDB_SQL_PASSWORD', CHECK_POLICY = ON;
          GO
          CREATE DATABASE MonitorAcceptanceBacked;
          GO
          CREATE DATABASE MonitorAcceptanceUnbacked;
          GO
          BACKUP DATABASE MonitorAcceptanceBacked
            TO DISK = N'/var/opt/mssql/data/MonitorAcceptanceBacked.bak'
            WITH INIT, CHECKSUM;
          GO
          SQL

      - name: Seed SQL Server Agent acceptance job after operational readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if docker exec -i "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$SQL_SA_PASSWORD" -C -b >/dev/null 2>&1 <<'SQL'
          USE msdb;
          IF NOT EXISTS (SELECT 1 FROM dbo.sysjobs WHERE name = N'MonitorAcceptanceJob')
          BEGIN
              EXEC dbo.sp_add_job
                  @job_name = N'MonitorAcceptanceJob',
                  @enabled = 1,
                  @description = N'P0 real SQL acceptance metadata only';
          END;
          IF NOT EXISTS (
              SELECT 1
              FROM dbo.sysjobs AS j
              INNER JOIN dbo.sysjobservers AS js ON js.job_id = j.job_id
              WHERE j.name = N'MonitorAcceptanceJob')
          BEGIN
              EXEC dbo.sp_add_jobserver @job_name = N'MonitorAcceptanceJob';
          END;
          GO
          SQL
            then
              echo "SQL Server Agent accepted job metadata after $attempt attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server Agent never reached operational job-metadata readiness." >&2
          docker logs "$SQL_CONTAINER" 2>&1 | tail -n 200 >&2
          exit 1

      - name: Apply monitored SQL least privilege
        shell: bash
        run: |
          set -euo pipefail
          docker cp scripts/sql/monitored_sql_least_privilege.sql \
            "$SQL_CONTAINER:/tmp/monitored_sql_least_privilege.sql"
          docker exec "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$SQL_SA_PASSWORD" -C -b \
            -v MonitorLogin="$MONITOR_LOGIN" \
            -i /tmp/monitored_sql_least_privilege.sql

      - name: Prepare intentionally incomplete permission profiles
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$SQL_SA_PASSWORD" -C -b <<SQL
          ALTER SERVER ROLE MonitorObserverServerRole ADD MEMBER [$NO_MSDB_LOGIN];
          USE master;
          CREATE USER [$NO_MSDB_LOGIN] FOR LOGIN [$NO_MSDB_LOGIN];
          ALTER ROLE MonitorObserverMasterRole ADD MEMBER [$NO_MSDB_LOGIN];
          GO
          SQL

      - name: Verify monitor login is not privileged
        shell: bash
        run: |
          set -euo pipefail
          RESULT=$(docker exec "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$SQL_SA_PASSWORD" -C -b -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT IS_SRVROLEMEMBER('sysadmin', '$MONITOR_LOGIN');")
          if [ "$(echo "$RESULT" | tr -d '[:space:]')" != "0" ]; then
            echo "Acceptance login unexpectedly has sysadmin membership." >&2
            exit 1
          fi

      - name: Restore
        run: dotnet restore Monitor.sln

      - name: Release build
        run: dotnet build Monitor.sln --configuration Release --no-restore --warnaserror

      - name: Run real SQL acceptance tests
        env:
          MONITOR_REQUIRE_REAL_SQL: '1'
          MONITOR_REAL_SQL_HOST: '127.0.0.1'
          MONITOR_REAL_SQL_PORT: '14333'
          MONITOR_REAL_SQL_USERNAME: 'monitor_acceptance'
          MONITOR_REAL_SQL_PASSWORD: ${{ env.MONITOR_SQL_PASSWORD }}
          MONITOR_LIMITED_SQL_USERNAME: 'monitor_limited'
          MONITOR_LIMITED_SQL_PASSWORD: ${{ env.LIMITED_SQL_PASSWORD }}
          MONITOR_NO_MSDB_SQL_USERNAME: 'monitor_no_msdb'
          MONITOR_NO_MSDB_SQL_PASSWORD: ${{ env.NO_MSDB_SQL_PASSWORD }}
        run: >-
          dotnet test Monitor.sln
          --configuration Release
          --no-build
          --filter "Category=RealSql"
          --logger "console;verbosity=normal"

      - name: SQL Server diagnostics on failure
        if: failure()
        shell: bash
        run: docker logs "$SQL_CONTAINER" 2>&1 | tail -n 200 || true

      - name: Remove ephemeral SQL Server
        if: always()
        shell: bash
        run: docker rm -f "$SQL_CONTAINER" >/dev/null 2>&1 || true
