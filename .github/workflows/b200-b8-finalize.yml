name: b200-b8-finalize
on:
  push:
    branches: [agent/b200-8]
    paths: ['.github/workflows/b200-b8-finalize.yml']
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/b200-8, fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet restore Monitor.sln
      - run: dotnet build Monitor.sln --configuration Release --no-restore --warnaserror
      - run: dotnet test Monitor.sln --configuration Release --no-build --logger 'trx;LogFileName=b200-b8-final.trx'
      - name: Sync docs
        shell: python
        env: { VERIFY_RUN: '${{ github.run_id }}' }
        run: |
          from pathlib import Path
          import os,re,xml.etree.ElementTree as ET
          run=os.environ['VERIFY_RUN']; trx=next(Path('tests').rglob('b200-b8-final.trx'))
          c=next(n for n in ET.parse(trx).iter() if n.tag.endswith('Counters'))
          total,passed,failed=c.attrib.get('total','?'),c.attrib.get('passed','?'),c.attrib.get('failed','?')
          p=Path('docs/BATCH_200.md'); s=p.read_text()
          for n in range(71,81): s=re.sub(rf'(\| B200-{n:03d} \|[^\n]*?\|) PLANNED \|',rf'\1 CI VERIFIED — RUN {run} |',s)
          marker='## Batch 9 — Performance & scale II'
          para=f'''Batch 8 centralizes enterprise download/header/filename policy and adds regression gates for fixed safe ZIP entry paths, Razor-encoded operator text, formula-safe metadata exports, bounded aggregate text input, strict incident route IDs, explicit authorization matrices and enterprise audit/diagnostic secret exclusions. Verification run `{run}` passed {passed}/{total} tests ({failed} failed).\n\n'''
          if 'Batch 8 centralizes enterprise download/header/filename policy' not in s: s=s.replace(marker,para+marker)
          p.write_text(s)
          Path('docs/STATUS.md').write_text(f'''# Project Status\n\n**Updated:** 2026-08-11 04:30 +03:00  \n**Branch:** `agent/b200-8`  \n**Target:** BATCH-200 / Batch 8 — Enterprise Security Hardening II  \n**Issues:** #76 umbrella · #91 Batch 8  \n**PR:** #92  \n**Overall:** 🟢 BATCH-100 100/100 COMPLETE · 🟢 B200-001..080 CI VERIFIED · 🟡 BATCH-200 80/100\n\n## Current verification\n- Finalizer run: `{run}`.\n- Release build: **Green** with `--warnaserror`.\n- Tests: **{passed}/{total} passed; {failed} failed**.\n- BATCH-200: **80/100 CI verified**.\n\n## Batch 8 delivered\n- Secure no-store/nosniff/noopen report download headers.\n- Allowlisted export filenames/extensions.\n- Safe ZIP entry-name policy and regression checks.\n- Razor XSS, formula-injection, input-budget and strict route-ID gates.\n- Explicit endpoint authorization and all-enterprise POST antiforgery matrix.\n- Audit/report/diagnostic secret exclusion tests.\n\n## Next\nB200-081..090 Performance & Scale II.\n''')
      - run: |
          git rm .github/workflows/b200-b8-finalize.yml
          git add docs/BATCH_200.md docs/STATUS.md
          git config user.name 'Monitor Release Gate'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'docs: mark B200-071..080 CI verified [skip ci]'
          git push origin HEAD:agent/b200-8
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh issue comment 76 --repo "$GITHUB_REPOSITORY" --body "B200-071..080 verified by run $GITHUB_RUN_ID; BATCH-200 is 80/100 CI verified."
          gh issue close 91 --repo "$GITHUB_REPOSITORY" --reason completed || true
          gh pr merge 92 --repo "$GITHUB_REPOSITORY" --squash --delete-branch --subject 'BATCH-200/8: harden enterprise security surfaces (#92)' --body "Complete B200-071..080. Finalizer $GITHUB_RUN_ID passed Release warnings-as-errors and the full test suite."
