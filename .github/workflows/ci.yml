name: ci

on:
  push:
    branches: [ main, 'agent/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Monitor.sln
      - name: Build
        run: dotnet build Monitor.sln --configuration Release --no-restore --warnaserror
      - name: Test
        run: dotnet test Monitor.sln --configuration Release --no-build
