name: ci

on:
  push:
    branches: [ main, 'agent/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  patch-459-tracking:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/459-operator-metadata-file-lease' && !contains(github.event.head_commit.message, '[tracking-patched-459]')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Patch canonical tracking without rewriting history
        shell: python
        run: |
          from pathlib import Path

          status = """## SingleNode operator metadata cross-process safety — #459 / PR #460

**Base:** `main@34613f419466f159f86a8499f5de69f1628e4875`.  
**Gap:** `FileOperatorMetadataStore` cached the shared server/incident envelope per process and protected access only with an instance-local lock, allowing stale reads and whole-envelope lost updates across overlapping SingleNode IIS workers.  
**Implementation:** PR #460 uses one stable `operator-metadata.json.lock` `CrossProcessFileLease` for the complete envelope, reloads and validates authoritative disk state under the lease before reads and read-modify-write mutations, and preserves existing normalization, bounds, note retention and atomic-save semantics. MultiNode SharedState is unchanged.  
**Regression contract:** two independently-created file stores must observe peer server/incident state, preserve independent server + incident mutations in the same envelope, and preserve peer incident notes across restart.  
**Pre-canonical-doc evidence:** code/test head `f26b7f6a86b75713fe8ffed0ccdb401070a1b19f` passed Linux Release build and full test step plus repository safety runtimes; SQL Server 2022 Real SQL and Windows production-candidate were selected for the source change.  
**Merge gate:** exact final docs-inclusive PR #460 head must remain current with `main`, have zero unresolved review threads, and pass Linux CI, Windows production-candidate, SQL Server 2022 Real SQL when selected/required, and both protected-P0 guards before Ready/squash merge and #459 completion.  
**Boundary:** no monitored-target SQL query/permission expansion, credential behavior change, MultiNode SharedState contract change, autonomous remediation, RC.61 publication, production IIS/SQL mutation, external P0 acceptance or branch-protection mutation. Manual/external order remains `#162 -> #116 -> #111`; #353 remains repository-admin only.
"""

          plan = """## Programming closure — SingleNode operator metadata cross-process state — #459 / PR #460

**Base:** `main@34613f419466f159f86a8499f5de69f1628e4875`.  
**Programming gap:** file-backed operator metadata persisted servers and incidents in one JSON envelope but cached that envelope per process, so overlapping IIS workers could read stale metadata or overwrite a peer server, incident assignment/acknowledgment, or note when saving the whole file.  
**Implementation:** acquire the existing bounded `CrossProcessFileLease` on one stable `operator-metadata.json.lock`, then reload + validate authoritative disk state before `GetServer`, `GetIncident`, `Snapshot`, `UpsertServer` and every incident mutation. The whole envelope intentionally shares one lease; existing `OperatorMetadataSnapshotValidator`, normalization, capacity/note bounds and `AtomicJsonFile.Save` remain authoritative. MultiNode compare/exchange state is unchanged.  
**Regression contract:** independent pre-created store instances must see peer reads, retain cross-entity envelope mutations and retain both peer notes after restart.  
**Pre-canonical-doc evidence:** head `f26b7f6a86b75713fe8ffed0ccdb401070a1b19f` passed Linux Release build + full test step and safety runtimes; Real SQL and Windows production-candidate were selected and the exact final docs-inclusive head must rerun every selected gate.  
**Definition of done for #459:** final PR #460 head current with `main`; zero unresolved review threads; Linux CI, Windows production-candidate, Real SQL if selected/required and both protected-P0 guards Green; then Ready, squash merge and close #459 completed.  
**Safety boundary:** no monitored-SQL permission/query expansion, secret/credential behavior change, SharedState contract change, autonomous remediation, RC.61 publication, production mutation, external acceptance or branch-protection mutation. Remaining external/manual dependency stays `#162 -> #116 -> #111`; #353 remains repository-admin only.
"""

          feature_row = "| SingleNode operator metadata cross-process lease | Closure / #459 | Implemented in PR #460; merge-gated | File-backed server + incident operator metadata share one stable `operator-metadata.json.lock`; reads and mutations reload validated authoritative disk state under the existing bounded `CrossProcessFileLease`, preventing stale reads and whole-envelope lost updates while preserving existing bounds, note retention and atomic-save behavior. Independent-instance regressions cover peer reads, cross-entity mutation preservation and peer-note preservation; final exact-head repository gates remain required before merge |\n"

          def insert_before_first_section(path, marker, section):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if marker in text:
                  return
              idx = text.find('## ')
              if idx < 0:
                  raise SystemExit(f'No section anchor in {path}')
              p.write_text(text[:idx] + section + '\n' + text[idx:], encoding='utf-8')

          insert_before_first_section('docs/STATUS.md', '#459 / PR #460', status)
          insert_before_first_section('docs/IMPLEMENTATION_PLAN.md', '#459 / PR #460', plan)

          catalog_path = Path('docs/FEATURE_CATALOG.md')
          catalog = catalog_path.read_text(encoding='utf-8')
          if '| Closure / #459 |' not in catalog:
              anchor = '|---|---|---|---|\n'
              if anchor not in catalog:
                  raise SystemExit('Feature catalog table anchor not found')
              catalog = catalog.replace(anchor, anchor + feature_row, 1)
              catalog_path.write_text(catalog, encoding='utf-8')
      - name: Commit canonical tracking
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/STATUS.md docs/IMPLEMENTATION_PLAN.md docs/FEATURE_CATALOG.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/STATUS.md docs/IMPLEMENTATION_PLAN.md docs/FEATURE_CATALOG.md
          git commit -m "Reconcile #459 canonical tracking [tracking-patched-459]"
          git push origin HEAD:agent/459-operator-metadata-file-lease

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject protected P0 issue closing keywords in PR metadata
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: bash scripts/Test-P0ProtectedIssueClosingKeywords.sh
      - name: Parse and exercise protected P0 issue closing-keyword safety
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/Test-P0ProtectedIssueClosingKeywords.sh
          bash -n scripts/Test-P0ProtectedIssueClosingKeywordSafety.sh
          bash scripts/Test-P0ProtectedIssueClosingKeywordSafety.sh
      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Monitor.sln
      - name: Build
        run: dotnet build Monitor.sln --configuration Release --no-restore --warnaserror
      - name: Test
        run: dotnet test Monitor.sln --configuration Release --no-build
      - name: Parse durable release Bash safety tooling
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/Verify-DurableReleaseToolchain.sh
          bash -n scripts/Test-DurableReleaseToolchainSafety.sh
          bash -n scripts/Verify-DurableRelease.sh
          bash -n scripts/Test-DurableReleaseVerifierSafety.sh
      - name: Exercise durable release toolchain capability runtime
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/Verify-DurableReleaseToolchain.sh
          bash scripts/Test-DurableReleaseToolchainSafety.sh
      - name: Exercise durable release verifier TOCTOU runtime
        shell: bash
        run: bash scripts/Test-DurableReleaseVerifierSafety.sh
      - name: Parse promotion, cutover-readiness and branch-protection PowerShell safety tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            'scripts/Test-ExistingCandidatePromotion.ps1',
            'scripts/Test-ExistingCandidatePromotionSafety.ps1',
            'scripts/Test-Rc61DurablePromotionPreflight.ps1',
            'scripts/Invoke-Rc61DurablePromotion.ps1',
            'scripts/Test-Rc61DurablePromotionOperatorSafety.ps1',
            'scripts/Test-Rc61CutoverReadiness.ps1',
            'scripts/Test-Rc61CutoverReadinessSafety.ps1',
            'scripts/Set-MainBranchProtection.ps1',
            'scripts/Test-MainBranchProtectionSafety.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path,
              [ref]$tokens,
              [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $messages = $errors | ForEach-Object { "${path}:$($_.Extent.StartLineNumber): $($_.Message)" }
              throw ($messages -join [Environment]::NewLine)
            }
          }
      - name: Exercise promotion ZIP safety runtime
        shell: pwsh
        run: ./scripts/Test-ExistingCandidatePromotionSafety.ps1
      - name: Exercise explicit RC.61 promotion operator fail-closed runtime
        shell: pwsh
        run: ./scripts/Test-Rc61DurablePromotionOperatorSafety.ps1
      - name: Exercise RC.61 cutover readiness fail-closed runtime
        shell: pwsh
        run: ./scripts/Test-Rc61CutoverReadinessSafety.ps1
      - name: Exercise main branch-protection fail-closed runtime
        shell: pwsh
        run: ./scripts/Test-MainBranchProtectionSafety.ps1
