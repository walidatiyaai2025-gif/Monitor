name: ci

on:
  push:
    branches: [ main, 'agent/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  reconcile_p0_116_handoff:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/p0-116-lock-operator-toolkit-commit'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Guarded canonical operator handoff reconciliation
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/PRODUCTION_SINGLENODE_ACCEPTANCE.md')
          text = path.read_text(encoding='utf-8')

          old_rule = "After #261 / PR #262 completes, the authoritative cutover toolkit must come from the **exact final PR #262 head** recorded on #261/#260/#258/#116 after all required exact-head Actions are Green. Do not use `main`, `latest`, a moving branch ref, or an unrecorded later commit as the tooling identity."
          new_rule = "The authoritative cutover toolkit source is the **exact final PR #262 head `b422eaaee53d931a62a43b3c36a53b68cd4f3e27`**, recorded on #261/#260/#258/#116 after Green exact-head Actions. That head passed CI #1786 / run `31992503009` and Windows production-candidate #186 / run `31992502977`. Do not use `main`, `latest`, a moving branch ref, or an unrecorded later commit as the tooling identity."
          old_value = "$operatorToolingCommit = '<exact-final-PR-262-head-recorded-on-261-260-258-116>'"
          new_value = "$operatorToolingCommit = 'b422eaaee53d931a62a43b3c36a53b68cd4f3e27'"

          for old, label in ((old_rule, 'stale provenance rule'), (old_value, 'tooling commit placeholder')):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')

          text = text.replace(old_rule, new_rule, 1).replace(old_value, new_value, 1)

          required = (
              'b422eaaee53d931a62a43b3c36a53b68cd4f3e27',
              '31992503009',
              '31992502977',
              'd0a71f8a5611621ee388a1109dedc76e1a6e70357404cb62c9c7aa188f49c3d5',
              '#162', '#116', '#111'
          )
          for value in required:
              if value not in text:
                  raise SystemExit(f'canonical handoff lost required identity/boundary: {value}')
          if '<exact-final-PR-262-head' in text or 'After #261 / PR #262 completes' in text:
              raise SystemExit('canonical handoff still contains stale PR #262 placeholder/state')

          path.write_text(text, encoding='utf-8')

      - name: Restore canonical CI and commit docs/tests-only reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/ci.yml
          git add .github/workflows/ci.yml docs/PRODUCTION_SINGLENODE_ACCEPTANCE.md
          git diff --cached --check
          git commit -m "P0.5: reconcile canonical RC61 toolkit handoff"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  build:
    if: github.event_name == 'push' || github.head_ref != 'agent/p0-116-lock-operator-toolkit-commit'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Monitor.sln
      - name: Build
        run: dotnet build Monitor.sln --configuration Release --no-restore --warnaserror
      - name: Test
        run: dotnet test Monitor.sln --configuration Release --no-build
