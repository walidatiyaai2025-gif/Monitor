name: ci

on:
  push:
    branches: [ main, 'agent/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Monitor.sln
      - name: Build
        run: dotnet build Monitor.sln --configuration Release --no-restore --warnaserror
      - name: Test
        run: dotnet test Monitor.sln --configuration Release --no-build
