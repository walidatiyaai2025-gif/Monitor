name: b200-b7-finalize
on:
  push:
    branches: [agent/b200-7]
    paths: ['.github/workflows/b200-b7-finalize.yml']
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/b200-7, fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet restore Monitor.sln
      - run: dotnet build Monitor.sln --configuration Release --no-restore --warnaserror
      - run: dotnet test Monitor.sln --configuration Release --no-build --logger 'trx;LogFileName=b200-b7-final.trx'
      - name: Sync docs
        shell: python
        env: { VERIFY_RUN: '${{ github.run_id }}' }
        run: |
          from pathlib import Path
          import os,re,xml.etree.ElementTree as ET
          run=os.environ['VERIFY_RUN']; trx=next(Path('tests').rglob('b200-b7-final.trx'))
          c=next(n for n in ET.parse(trx).iter() if n.tag.endswith('Counters'))
          total,passed,failed=c.attrib.get('total','?'),c.attrib.get('passed','?'),c.attrib.get('failed','?')
          p=Path('docs/BATCH_200.md'); s=p.read_text()
          for n in range(61,71): s=re.sub(rf'(\| B200-{n:03d} \|[^\n]*?\|) PLANNED \|',rf'\1 CI VERIFIED — RUN {run} |',s)
          marker='## Batch 8 — Enterprise security hardening II'
          para=f'''Batch 7 adds shared operator-state disaster recovery around the raw `monitor:operator-metadata:v1` shared document: checksummed/versioned export, dry-run validation, CAS restore, read-back verification and rollback. HA tests cover shared-state failure diagnostics, reporting during concurrent metadata writes, cross-node recommendation acknowledgments, note convergence and maintenance/scheduler consistency. Verification run `{run}` passed {passed}/{total} tests ({failed} failed).\n\n'''
          if 'Batch 7 adds shared operator-state disaster recovery' not in s: s=s.replace(marker,para+marker)
          p.write_text(s)
          Path('docs/STATUS.md').write_text(f'''# Project Status\n\n**Updated:** 2026-08-11 04:15 +03:00  \n**Branch:** `agent/b200-7`  \n**Target:** BATCH-200 / Batch 7 — HA & disaster recovery for operator state  \n**Issues:** #76 umbrella · #89 Batch 7  \n**PR:** #90  \n**Overall:** 🟢 BATCH-100 100/100 COMPLETE · 🟢 B200-001..070 CI VERIFIED · 🟡 BATCH-200 70/100\n\n## Current verification\n- Finalizer run: `{run}`.\n- Release build: **Green** with `--warnaserror`.\n- Tests: **{passed}/{total} passed; {failed} failed**.\n- BATCH-200: **70/100 CI verified**.\n\n## Batch 7 delivered\n- Raw shared operator-state backup with checksum/source version.\n- Dry-run restore validation and CAS restore with verification/rollback.\n- Opaque diagnostics under shared-state degradation.\n- Concurrent reporting and cross-node operator-state convergence tests.\n- Cross-node maintenance scheduler policy validation.\n\n## Next\nB200-071..080 Enterprise Security Hardening II.\n''')
      - run: |
          git rm .github/workflows/b200-b7-finalize.yml
          git add docs/BATCH_200.md docs/STATUS.md
          git config user.name 'Monitor Release Gate'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'docs: mark B200-061..070 CI verified [skip ci]'
          git push origin HEAD:agent/b200-7
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh issue comment 76 --repo "$GITHUB_REPOSITORY" --body "B200-061..070 verified by run $GITHUB_RUN_ID; BATCH-200 is 70/100 CI verified."
          gh issue close 89 --repo "$GITHUB_REPOSITORY" --reason completed || true
          gh pr merge 90 --repo "$GITHUB_REPOSITORY" --squash --delete-branch --subject 'BATCH-200/7: add HA operator-state recovery (#90)' --body "Complete B200-061..070. Finalizer $GITHUB_RUN_ID passed Release warnings-as-errors and the full test suite."
