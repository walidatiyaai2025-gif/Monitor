name: protected-p0-pr-metadata

on:
  pull_request_target:
    branches: [ main ]
    types: [ opened, synchronize, reopened, edited ]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - name: Reject protected P0 issue closing keywords in PR metadata
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: bash scripts/Test-P0ProtectedIssueClosingKeywords.sh
