name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  verified-production-package:
    needs: resolve-version
    uses: ./.github/workflows/production-candidate.yml
    with:
      candidate_version: ${{ needs.resolve-version.outputs.version }}

  publish-tagged-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - resolve-version
      - verified-production-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download verified production package from this run
        uses: actions/download-artifact@v4
        with:
          name: Monitor-${{ needs.resolve-version.outputs.version }}-win-x64
          path: artifacts

      - name: Verify downloaded product checksum
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          zip_name="Monitor-${RELEASE_VERSION}-win-x64.zip"
          checksum_name="${zip_name}.sha256"
          zip_path="artifacts/${zip_name}"
          checksum_path="artifacts/${checksum_name}"

          test -f "${zip_path}"
          test -f "${checksum_path}"

          checksum_line="$(tr -d '\r\n' < "${checksum_path}")"
          if [[ ! "${checksum_line}" =~ ^([a-f0-9]{64})[[:space:]]+([^[:space:]]+)$ ]]; then
            echo "Companion checksum format is invalid." >&2
            exit 1
          fi

          expected_hash="${BASH_REMATCH[1]}"
          expected_name="${BASH_REMATCH[2]}"
          if [[ "${expected_name}" != "${zip_name}" ]]; then
            echo "Companion checksum references an unexpected filename." >&2
            exit 1
          fi

          actual_hash="$(sha256sum "${zip_path}" | awk '{print $1}')"
          if [[ "${actual_hash}" != "${expected_hash}" ]]; then
            echo "Downloaded product ZIP does not match its companion checksum." >&2
            exit 1
          fi

          echo "zip_name=${zip_name}" >> "${GITHUB_OUTPUT}"
          echo "checksum_name=${checksum_name}" >> "${GITHUB_OUTPUT}"
          echo "product_sha256=${actual_hash}" >> "${GITHUB_OUTPUT}"

      - name: Publish immutable GitHub Release assets
        shell: bash
        env:
          ZIP_NAME: ${{ steps.verify.outputs.zip_name }}
          CHECKSUM_NAME: ${{ steps.verify.outputs.checksum_name }}
          PRODUCT_SHA256: ${{ steps.verify.outputs.product_sha256 }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            existing_dir="${RUNNER_TEMP}/existing-release"
            rm -rf "${existing_dir}"
            mkdir -p "${existing_dir}"

            gh release download "${RELEASE_TAG}" \
              --pattern "${ZIP_NAME}" \
              --pattern "${CHECKSUM_NAME}" \
              --dir "${existing_dir}"

            test -f "${existing_dir}/${ZIP_NAME}"
            test -f "${existing_dir}/${CHECKSUM_NAME}"

            existing_hash="$(sha256sum "${existing_dir}/${ZIP_NAME}" | awk '{print $1}')"
            existing_checksum_line="$(tr -d '\r\n' < "${existing_dir}/${CHECKSUM_NAME}")"
            if [[ ! "${existing_checksum_line}" =~ ^([a-f0-9]{64})[[:space:]]+([^[:space:]]+)$ ]]; then
              echo "Existing release checksum asset is invalid; refusing mutation." >&2
              exit 1
            fi

            if [[ "${existing_hash}" != "${PRODUCT_SHA256}" || "${BASH_REMATCH[1]}" != "${PRODUCT_SHA256}" || "${BASH_REMATCH[2]}" != "${ZIP_NAME}" ]]; then
              echo "Existing release assets differ from the verified candidate; refusing mutation." >&2
              exit 1
            fi

            echo "Existing GitHub Release already contains the exact verified product ZIP/checksum; leaving it immutable."
            exit 0
          fi

          release_flags=()
          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "${RELEASE_TAG}" \
            "artifacts/${ZIP_NAME}#Verified Windows x64 production package" \
            "artifacts/${CHECKSUM_NAME}#SHA-256 checksum" \
            --verify-tag \
            --title "Monitor ${RELEASE_VERSION}" \
            "${release_flags[@]}"
