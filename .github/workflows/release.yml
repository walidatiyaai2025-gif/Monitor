name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  resolve-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  verified-production-package:
    needs: resolve-version
    uses: ./.github/workflows/production-candidate.yml
    with:
      candidate_version: ${{ needs.resolve-version.outputs.version }}

  publish-tagged-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - resolve-version
      - verified-production-package
    concurrency:
      group: monitor-release-tag-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download verified production package from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Monitor-${{ needs.resolve-version.outputs.version }}-win-x64
          path: artifacts

      - name: Verify downloaded product checksum
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          zip_name="Monitor-${RELEASE_VERSION}-win-x64.zip"
          checksum_name="${zip_name}.sha256"
          zip_path="artifacts/${zip_name}"
          checksum_path="artifacts/${checksum_name}"

          mapfile -t payload_entries < <(find artifacts -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          if [[ "${#payload_entries[@]}" -ne 2 || "${payload_entries[0]}" != "${zip_name}" || "${payload_entries[1]}" != "${checksum_name}" ]]; then
            echo "Verified production artifact must contain exactly the product ZIP and companion checksum." >&2
            exit 1
          fi

          test -f "${zip_path}"
          test -f "${checksum_path}"

          checksum_line="$(cat "${checksum_path}")"
          if [[ ! "${checksum_line}" =~ ^([a-f0-9]{64})\ \ ([^[:space:]]+)$ ]]; then
            echo "Companion checksum format is invalid; expected lowercase SHA-256, two spaces, and the exact ZIP filename." >&2
            exit 1
          fi

          expected_hash="${BASH_REMATCH[1]}"
          expected_name="${BASH_REMATCH[2]}"
          if [[ "${expected_name}" != "${zip_name}" ]]; then
            echo "Companion checksum references an unexpected filename." >&2
            exit 1
          fi

          actual_hash="$(sha256sum "${zip_path}" | awk '{print $1}')"
          if [[ "${actual_hash}" != "${expected_hash}" ]]; then
            echo "Downloaded product ZIP does not match its companion checksum." >&2
            exit 1
          fi

          echo "zip_name=${zip_name}" >> "${GITHUB_OUTPUT}"
          echo "checksum_name=${checksum_name}" >> "${GITHUB_OUTPUT}"
          echo "product_sha256=${actual_hash}" >> "${GITHUB_OUTPUT}"

      - name: Publish immutable GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_NAME: ${{ steps.verify.outputs.zip_name }}
          CHECKSUM_NAME: ${{ steps.verify.outputs.checksum_name }}
          PRODUCT_SHA256: ${{ steps.verify.outputs.product_sha256 }}
        run: |
          set -euo pipefail
          expected_prerelease=false
          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            expected_prerelease=true
          fi

          verify_release_assets() {
            local dir="$1"
            local release_json
            release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
            if [[ "$(jq -r '.tag_name' <<<"${release_json}")" != "${RELEASE_TAG}" || \
                  "$(jq -r '.draft' <<<"${release_json}")" != false || \
                  "$(jq -r '.prerelease' <<<"${release_json}")" != "${expected_prerelease}" || \
                  "$(jq -r '.name' <<<"${release_json}")" != "Monitor ${RELEASE_VERSION}" ]]; then
              echo "Release metadata does not match the verified tag/version/title contract; refusing acceptance." >&2
              exit 1
            fi

            rm -rf "${dir}"
            mkdir -p "${dir}"

            mapfile -t names < <(jq -r '.assets[].name' <<<"${release_json}" | sort)
            if [[ "${#names[@]}" -ne 2 || "${names[0]}" != "${ZIP_NAME}" || "${names[1]}" != "${CHECKSUM_NAME}" ]]; then
              echo "Release must contain exactly the verified ZIP and checksum assets; refusing acceptance." >&2
              exit 1
            fi

            local zip_meta
            local checksum_meta
            zip_meta="$(jq -c --arg name "${ZIP_NAME}" '.assets[] | select(.name == $name)' <<<"${release_json}")"
            checksum_meta="$(jq -c --arg name "${CHECKSUM_NAME}" '.assets[] | select(.name == $name)' <<<"${release_json}")"

            local zip_id checksum_id zip_size checksum_size zip_digest checksum_digest zip_url checksum_url
            zip_id="$(jq -r '.id' <<<"${zip_meta}")"
            checksum_id="$(jq -r '.id' <<<"${checksum_meta}")"
            zip_size="$(jq -r '.size' <<<"${zip_meta}")"
            checksum_size="$(jq -r '.size' <<<"${checksum_meta}")"
            zip_digest="$(jq -r '.digest' <<<"${zip_meta}")"
            checksum_digest="$(jq -r '.digest' <<<"${checksum_meta}")"
            zip_url="$(jq -r '.browser_download_url' <<<"${zip_meta}")"
            checksum_url="$(jq -r '.browser_download_url' <<<"${checksum_meta}")"

            [[ "$(jq -r '.state' <<<"${zip_meta}")" == uploaded && "$(jq -r '.state' <<<"${checksum_meta}")" == uploaded ]]
            [[ "${zip_id}" =~ ^[1-9][0-9]*$ && "${checksum_id}" =~ ^[1-9][0-9]*$ && "${zip_id}" != "${checksum_id}" ]]
            [[ "${zip_size}" =~ ^[1-9][0-9]*$ && "${checksum_size}" =~ ^[1-9][0-9]*$ ]]
            [[ "${zip_digest}" =~ ^sha256:[a-f0-9]{64}$ && "${checksum_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
            [[ "${zip_digest}" == "sha256:${PRODUCT_SHA256}" ]]
            [[ "${zip_url}" == "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ZIP_NAME}" ]]
            [[ "${checksum_url}" == "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${CHECKSUM_NAME}" ]]

            gh release download "${RELEASE_TAG}" \
              --pattern "${ZIP_NAME}" \
              --pattern "${CHECKSUM_NAME}" \
              --dir "${dir}"

            test -f "${dir}/${ZIP_NAME}"
            test -f "${dir}/${CHECKSUM_NAME}"
            [[ "$(stat -c%s "${dir}/${ZIP_NAME}")" == "${zip_size}" ]]
            [[ "$(stat -c%s "${dir}/${CHECKSUM_NAME}")" == "${checksum_size}" ]]

            local existing_hash
            local existing_checksum_line
            local existing_checksum_asset_hash
            existing_hash="$(sha256sum "${dir}/${ZIP_NAME}" | awk '{print $1}')"
            existing_checksum_line="$(cat "${dir}/${CHECKSUM_NAME}")"
            existing_checksum_asset_hash="$(sha256sum "${dir}/${CHECKSUM_NAME}" | awk '{print $1}')"
            if [[ ! "${existing_checksum_line}" =~ ^([a-f0-9]{64})\ \ ([^[:space:]]+)$ ]]; then
              echo "Release checksum asset is non-canonical; refusing acceptance." >&2
              exit 1
            fi

            if [[ "${existing_hash}" != "${PRODUCT_SHA256}" || \
                  "${BASH_REMATCH[1]}" != "${PRODUCT_SHA256}" || \
                  "${BASH_REMATCH[2]}" != "${ZIP_NAME}" || \
                  "${checksum_digest}" != "sha256:${existing_checksum_asset_hash}" ]]; then
              echo "Existing release assets differ from the verified candidate or API digests; refusing mutation." >&2
              exit 1
            fi
          }

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            verify_release_assets "${RUNNER_TEMP}/existing-release"
            echo "Existing GitHub Release already contains exactly the verified product ZIP/checksum; leaving it immutable."
            exit 0
          fi

          release_flags=()
          if [[ "${expected_prerelease}" == true ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "${RELEASE_TAG}" \
            "artifacts/${ZIP_NAME}#Verified Windows x64 production package" \
            "artifacts/${CHECKSUM_NAME}#SHA-256 checksum" \
            --verify-tag \
            --title "Monitor ${RELEASE_VERSION}" \
            "${release_flags[@]}"

          verify_release_assets "${RUNNER_TEMP}/created-release"
