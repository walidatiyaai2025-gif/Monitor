name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Restore
        run: dotnet restore Monitor.sln

      - name: Build
        run: dotnet build Monitor.sln --configuration Release --no-restore --warnaserror

      - name: Test
        run: dotnet test Monitor.sln --configuration Release --no-build

      - name: Publish Windows x64
        run: >-
          dotnet publish src/Monitor.Web/Monitor.Web.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          --output artifacts/publish

      - name: Package and checksum
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p artifacts/release
          (cd artifacts/publish && zip -qr "../release/Monitor-${version}-win-x64.zip" .)
          (cd artifacts/release && sha256sum "Monitor-${version}-win-x64.zip" > "Monitor-${version}-win-x64.zip.sha256")

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: Monitor-${{ steps.version.outputs.version }}-win-x64
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14
