          replace_once(
              batch,
              "- [x] B800-090 close the reports/exports tranche with a Viewer+ bounded/versioned estate-wide cached Storage Health summary CSV from enabled registrations + snapshot-cache `Peek(...)`; keep allocation separate from I/O availability, reuse anonymous B400 `IoLatencyProjection` evidence, exclude logical file/database identities and physical paths, and never represent allocation as disk capacity or cumulative I/O as interval history (`docs/work/B800-090.md`, PR #325).",
