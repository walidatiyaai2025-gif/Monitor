              "| Reports tranche cross-layer acceptance contract | BATCH-800 / B800-091 | In validation / PR #326 | Test/documentation-only acceptance matrix locks the nine Viewer+ B800-081..090 routes to exact templates + `Monitor.Read`, keeps Audit/Manifest as `Monitor.Manage` negative controls, locks global/contextual discoverability, rejects direct query/collector/refresh/`SqlConnection` dependencies in report web/service layers, and retains visible `Unavailable`/`NotEvaluated` plus allocation-vs-capacity truth wording. Implementation head `7d6b58ba8383412cafeec1228f88e9bcae1a3eda` passed CI #2824 / `32083874505`; Real SQL and Windows were not selected because no production/runtime path changed |",
