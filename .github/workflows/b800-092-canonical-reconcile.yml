          replace_once(
              catalog,
              "\n\n## BATCH-200 Enterprise Operations Expansion",
              "\n| Write-surface role + antiforgery acceptance | BATCH-800 / B800-092 | In validation / PR #327 | Test/documentation-only reflection matrix discovers every public MVC POST, requires `ValidateAntiForgeryToken`, permits anonymous POST only for `/login`, requires authorization everywhere else, locks every non-account mutation to the deliberate `Manage`/`Operate`/`Advisor` policy map, and keeps sensitive administration controllers class-level `Manage`. Implementation head `f5ef7b33ed0414ae36c721cf146164d717fb9e10` passed CI #2837 / `32084794120`; Real SQL and Windows were not selected because no production/runtime path changed |\n\n## BATCH-200 Enterprise Operations Expansion")

