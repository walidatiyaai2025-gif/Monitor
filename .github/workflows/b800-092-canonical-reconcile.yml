name: b800-092-canonical-reconcile

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/b800-092-canonical-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/b800-092-write-surface-security-acceptance
          fetch-depth: 0
      - name: Reconcile B800-092 canonical documentation with guarded replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one guarded match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          batch = "docs/BATCH_800.md"
          replace_once(
              batch,
              "- [x] B800-091 lock the completed B800-081..090 report tranche as one cross-layer acceptance contract: exact Viewer+ route templates + `Monitor.Read`, Admin Audit/Manifest `Monitor.Manage` overrides, global/contextual discoverability, no direct query/collector/refresh/`SqlConnection` dependency, and retained `Unavailable`/`NotEvaluated` truth language (`docs/work/B800-091.md`, PR #326).\n- [ ] B800-092..100 continue final role/antiforgery, no-fake-data, responsive/accessibility, canonical exact-head and closeout acceptance without adding unsupported production behavior.",
              "- [x] B800-091 lock the completed B800-081..090 report tranche as one cross-layer acceptance contract: exact Viewer+ route templates + `Monitor.Read`, Admin Audit/Manifest `Monitor.Manage` overrides, global/contextual discoverability, no direct query/collector/refresh/`SqlConnection` dependency, and retained `Unavailable`/`NotEvaluated` truth language (`docs/work/B800-091.md`, PR #326 merged as `500d4da98508ef1a96f1c29451317ff800143fc7`).\n- [x] B800-092 lock every MVC POST behind controller-side antiforgery plus explicit authorization: login is the sole anonymous POST, logout remains authenticated, and every non-account mutation is deliberately mapped to `Monitor.Manage`, `Monitor.Operate` or `Monitor.Advisor` with future unknown POSTs failing CI (`docs/work/B800-092.md`, PR #327).\n- [ ] B800-093..100 continue no-fake-data, responsive/accessibility, canonical exact-head and final closeout acceptance without adding unsupported production behavior.")
          replace_once(
              batch,
              "\n\n## Task program",
              "\n\nB800-092 continues final acceptance without changing production. `B800WriteSurfaceSecurityAcceptanceTests` discovers every public MVC `HttpPost` action by reflection, requires `ValidateAntiForgeryToken` on every POST, permits anonymous mutation only for antiforgery-protected `/login`, keeps `/logout` authenticated, and locks every non-account mutation to the existing `Monitor.Manage` / `Monitor.Operate` / `Monitor.Advisor` policy matrix. Sensitive ConnectionLab/OperationalBackup/Governance/ServerConnections controllers remain class-level `Manage`, and any future POST outside the deliberate matrix fails CI. Implementation head `f5ef7b33ed0414ae36c721cf146164d717fb9e10` passed CI #2837 / `32084794120`; Real SQL and Windows were not selected because the slice changes tests/documentation only.\n\n## Task program")
          replace_once(
              batch,
              "- B800-091 implementation head `7d6b58ba8383412cafeec1228f88e9bcae1a3eda` passed CI #2824 / `32083874505`, including full tests and repository safety tooling. Real SQL and Windows production-candidate were not selected because the slice changes tests/documentation only. Exact final post-canonical-reconciliation validation remains required.\n\n## Current B800-091 merge gate\n\nPR #326 is the current focused B800 slice and closes B800-091 only. B800-090 / PR #325 and the B800-081..090 reports/exports tranche are merged; B800-091 adds cross-layer acceptance coverage only. Before PR #326 is marked Ready or merged, every repository-selected required workflow must be Green on the same exact final reconciled head, the branch must remain current with `main`, review threads must remain resolved, and the effective diff must stay bounded to the B800-091 test/work-note plus canonical reconciliation. Real SQL/Windows are required only if repository path policy selects them. Issue #287 remains OPEN for B800-092..100 final acceptance/closeout work.",
              "- B800-091 implementation head `7d6b58ba8383412cafeec1228f88e9bcae1a3eda` passed CI #2824 / `32083874505`; exact final reconciled head `4ec5bf5970c5d7f32fd05e995f05c13ff73b740e` passed CI #2831 / `32084089512`, Real SQL #369 / `32084089440`, and Windows production-candidate #526 / `32084089450`; PR #326 squash-merged as `500d4da98508ef1a96f1c29451317ff800143fc7`.\n- B800-092 implementation head `f5ef7b33ed0414ae36c721cf146164d717fb9e10` passed CI #2837 / `32084794120`, including full tests and repository safety tooling. Real SQL and Windows production-candidate were not selected because the slice changes tests/documentation only. Exact final post-canonical-reconciliation validation remains required.\n\n## Current B800-092 merge gate\n\nPR #327 is the current focused B800 slice and closes B800-092 only. B800-091 / PR #326 is merged; B800-092 adds write-surface role/antiforgery acceptance coverage only. Before PR #327 is marked Ready or merged, every repository-selected required workflow must be Green on the same exact final reconciled head, the branch must remain current with `main`, review threads must remain resolved, and the effective diff must stay bounded to the B800-092 test/work-note plus canonical reconciliation. Real SQL/Windows are required only if repository path policy selects them. Issue #287 remains OPEN for B800-093..100 final acceptance/closeout work.")

