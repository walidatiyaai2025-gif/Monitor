# Retry after enterprise runtime wiring fix.
name: batch100-finalize

on:
  push:
    branches:
      - agent/b100-10
    paths:
      - '.github/workflows/batch100-finalize.yml'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b100-10
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Monitor.sln

      - name: Release build
        run: dotnet build Monitor.sln --configuration Release --no-restore --warnaserror

      - name: RC tests
        run: dotnet test Monitor.sln --configuration Release --no-build --logger 'trx;LogFileName=batch100-final.trx'

      - name: Synchronize canonical completion docs
        shell: python
        env:
          VERIFY_RUN: ${{ github.run_id }}
        run: |
          from pathlib import Path
          import os, re, xml.etree.ElementTree as ET

          root = Path('.')
          run = os.environ['VERIFY_RUN']
          trx = next((root / 'tests').rglob('batch100-final.trx'))
          tree = ET.parse(trx)
          counters = next(node for node in tree.iter() if node.tag.endswith('Counters'))
          total = counters.attrib.get('total', '?')
          passed = counters.attrib.get('passed', '?')
          failed = counters.attrib.get('failed', '?')

          plan = root / 'docs/IMPLEMENTATION_PLAN.md'
          s = plan.read_text()
          s = re.sub(r'\| Batch 10 \| B100-091\.\.100 \| Enterprise operator features & RC acceptance \|[^\n]*\|',
                     f'| Batch 10 | B100-091..100 | Enterprise operator features & RC acceptance | CI VERIFIED — {run} |', s)
          s = re.sub(r'Current progress: \*\*90/100 tasks CI verified[^\n]*\*\*\..*?(?=\n\n## Delivery loop)',
                     f'Current progress: **100/100 tasks CI verified**. Batch 10 verification run `{run}` passed Release build with warnings-as-errors and the complete RC suite ({passed}/{total} passed; {failed} failed). The BATCH-100 production/enterprise program is complete.', s, flags=re.S)
          plan.write_text(s)

          ledger = root / 'docs/BATCH_100.md'
          s = ledger.read_text()
          for n in range(91, 101):
              s = re.sub(rf'(\| B100-{n:03d} \|[^\n]*?\|) (PLANNED|IMPLEMENTED — FINAL CI PENDING) \|',
                         rf'\1 CI VERIFIED — RUN {run} |', s)
          completion = f'''\nBatch 10 verification run `{run}` passed Release warnings-as-errors build and the complete test suite ({passed}/{total} passed; {failed} failed). BATCH-100 is **100/100 CI VERIFIED**. Enterprise operator governance remains separate bounded state; report/diagnostic GETs remain control-plane/cache-only and no autonomous execution path was added.\n'''
          if 'BATCH-100 is **100/100 CI VERIFIED**' not in s:
              s = s.replace('\n## Delivery rule\n', completion + '\n## Delivery rule\n')
          ledger.write_text(s)

          status = root / 'docs/STATUS.md'
          status.write_text(f'''# Project Status\n\n**Updated:** 2026-08-11 02:30 +03:00  \n**Branch:** `agent/b100-10`  \n**Target:** BATCH-100 / Batch 10 — Enterprise operator features & RC acceptance  \n**Issues:** #55 umbrella · #74 Batch 10  \n**PR:** #75 — BATCH-100/10: complete enterprise operator features and RC acceptance  \n**Overall:** 🟢 M0–M8 VERIFIED · 🟢 B100-001..100 CI VERIFIED · 🟢 BATCH-100 COMPLETE\n\n## Final verification\n\n- GitHub Actions verification run: `{run}`.\n- Release build: **Green** with `--warnaserror`.\n- Tests: **{passed}/{total} passed; {failed} failed**.\n- B100-091..100: CI VERIFIED.\n- Program total: **100/100 CI VERIFIED**.\n\n## Final enterprise scope\n\n- Bounded UTC maintenance and alert-suppression windows.\n- Durable environment/group/tag server governance.\n- Durable incident owner/assignee and bounded operator notes.\n- Current deterministic recommendation acknowledgment state.\n- Formula-safe cache-only CSV report.\n- Administrator-only bounded redacted diagnostics package.\n- `/enterprise` policy/antiforgery-protected operator surface.\n- RC acceptance test mapped to every B100-091..100 task.\n\n## Stable guardrails\n\n- Browser/report/diagnostic GETs do not initiate monitored-SQL collection.\n- No plaintext credentials/full connection strings/provider errors/SQL text in operator exports or diagnostics.\n- No autonomous remediation or AI SQL execution.\n- MultiNode remains fail-closed behind existing readiness/security/state prerequisites.\n\n## State\n\nReady for squash merge of PR #75 to stable `main`.\n''')

          catalog = root / 'docs/FEATURE_CATALOG.md'
          s = catalog.read_text()
          rows = f'''| Enterprise server governance metadata | B100 | CI verified | Environment, group/tags, bounded UTC maintenance and alert-suppression windows; B100-091..094; CI {run} |\n| Enterprise incident operator metadata | B100 | CI verified | Assignee, bounded notes and current-recommendation acknowledgment; B100-095..097; CI {run} |\n| Safe enterprise export & diagnostics | B100 | CI verified | Formula-safe cache-only CSV plus bounded Administrator redacted ZIP; B100-098/099; CI {run} |\n| Release-candidate enterprise acceptance | B100 | CI verified | One explicit regression test per B100-091..100 plus route authorization/antiforgery gate; B100-100; CI {run} |\n'''
          if 'Enterprise server governance metadata' not in s:
              marker = '| Zero-SQL monitored GETs |'
              idx = s.find(marker)
              s = s[:idx] + rows + s[idx:] if idx >= 0 else s + '\n' + rows
          else:
              s = re.sub(r'\| Enterprise server governance metadata .*?(?=\| Zero-SQL monitored GETs \|)', rows, s, flags=re.S)
          catalog.write_text(s)

          decisions = root / 'docs/DECISIONS.md'
          s = decisions.read_text()
          adr = '''\n## ADR-042 — Enterprise operator governance is separate bounded state and exports remain control-plane-only\nB100-091..100 keeps maintenance/classification/suppression/ownership/note/acknowledgment metadata outside canonical server-registration and incident-lifecycle records. `IOperatorMetadataStore` provides InMemory, atomic File and optimistic Shared-State implementations, avoiding a breaking migration of established persistence contracts. Maintenance and alert-suppression windows are explicit bounded UTC policy intervals; suppression never deletes or rewrites incident evidence.\n\nIncident notes and assignees are bounded and validated; notes reject credential/connection-shaped material. Recommendation acknowledgment binds to a stable SHA-256-derived key for the current deterministic recommendation and rejects stale/arbitrary route keys. Mutations remain POST + antiforgery + named authorization policy.\n\nCSV export uses registration/operator metadata plus snapshot-cache `Peek` only, neutralizes spreadsheet formula prefixes and excludes SQL endpoints/secret references. Administrator diagnostics contains only aggregate readiness/deployment/count metadata, is size-bounded, and excludes server identity/endpoints, incident evidence, operator notes, credentials, provider detail, environment-variable values and SQL text.\n'''
          if '## ADR-042' not in s:
              s = s.rstrip() + adr + '\n'
          decisions.write_text(s)

          readme = root / 'README.md'
          s = readme.read_text()
          section = '''\n## Enterprise operations\n\n`/enterprise` is the bounded control-plane surface for environment classification, groups/tags, maintenance and alert-suppression windows, incident ownership/notes and deterministic recommendation acknowledgment. Mutations require Operator/Administrator authorization plus antiforgery.\n\n`/reports/servers.csv` exports formula-safe registration/operator/cached-snapshot metadata and never initiates monitored SQL collection. `/diagnostics/package` is Administrator-only and returns a bounded redacted ZIP of aggregate readiness/deployment/count metadata; it excludes SQL endpoints, credentials, secret references, incident evidence, operator note content, provider detail and SQL text.\n'''
          if '## Enterprise operations' not in s:
              s = s.rstrip() + section + '\n'
          readme.write_text(s)

      - name: Remove one-shot finalizer and commit verified docs
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/batch100-finalize.yml
          git add README.md docs/IMPLEMENTATION_PLAN.md docs/BATCH_100.md docs/STATUS.md docs/FEATURE_CATALOG.md docs/DECISIONS.md
          git config user.name 'Monitor Release Gate'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'docs: mark BATCH-100 100/100 CI verified'
          git push origin HEAD:agent/b100-10

      - name: Close task issues and merge final PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 55 --repo "$GITHUB_REPOSITORY" --body "BATCH-100 final verification run $GITHUB_RUN_ID passed Release warnings-as-errors build and the complete test suite. B100-001..100 are 100/100 CI VERIFIED. Final PR: #75."
          gh issue close 74 --repo "$GITHUB_REPOSITORY" --reason completed || true
          gh issue close 55 --repo "$GITHUB_REPOSITORY" --reason completed || true
          gh pr merge 75 --repo "$GITHUB_REPOSITORY" --squash --delete-branch --subject 'BATCH-100/10: complete enterprise operator features and RC acceptance (#75)' --body "Complete B100-091..100 and the 100-task BATCH-100 program. Verification workflow: $GITHUB_RUN_ID. Release build used --warnaserror and the complete test suite passed."
